name: Market Data

# 정책 → 시장 영향 부가 데이터(docs/market/)를 하루 한 번 갱신한다(pipeline/market_stats.py).
#  - 시세: 금융위원회 주식시세정보·증권상품시세정보(data.go.kr, DATA_GO_KR_KEY 활용신청 필요)는
#    다음 영업일 오후에 전일 종가가 올라오므로 KST 18:00에 돈다.
#  - 공시: DART_API_KEY가 있으면 관련 기업 최근 30일 공시를 모은다.
# 키가 없으면 해당 단계만 건너뛰고 성공으로 끝난다.
on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC = 18:00 KST
  workflow_dispatch:

permissions:
  contents: write

# 정기 파이프라인과 같은 docs/를 고치므로 동시에 돌지 않게 한다.
concurrency:
  group: policy-pipeline
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Update market data
        run: python -m pipeline.market_stats
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/market/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update market data [skip ci]"
          git pull --rebase
          git push
